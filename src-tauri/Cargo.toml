[package]
name = "retro-dev-studio"
version = "0.1.0"
description = "RetroDev Studio - 16-bit game development platform"
authors = ["RetroDev Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "pnm", "jpeg", "gif", "webp"] }
sevenz-rust2 = { version = "0.16", features = ["util"] }
