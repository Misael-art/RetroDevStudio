[package]
name = "retro-dev-studio"
version = "0.1.0"
description = "RetroDev Studio - 16-bit game development platform"
authors = ["RetroDev Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Biblioteca de endereçamento REX (Experimental). Dependencia de caminho: não
# traz crates externos para `Cargo.lock` e continua sem Tauri/serde — a
# serialização e a tradução de erros vivem no adaptador
# `tools/reverse/decomp/rex_addressing.rs`.
rex-addressing = { path = "../crates/rex-addressing" }
# Adaptador Kosinski (`tools/reverse/decomp/rex_kosinski.rs`); biblioteca standalone
# da frente B, sen Tauri nin dependencias externas.
rex-kosinski = { path = "../crates/rex-kosinski" }
# Perfil MUGEN -> SGDK (`core/mugen_profile.rs`); biblioteca standalone da frente MUGEN, sem dependencias. PROPOSTA ao integrador.
rex-mugen = { path = "../crates/rex-mugen" }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "pnm", "jpeg", "gif", "webp"] }
sevenz-rust2 = { version = "0.16", features = ["util"] }
