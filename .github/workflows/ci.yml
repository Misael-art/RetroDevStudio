name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency security audit
        id: dependency_audit
        run: npm run security:audit

      - name: Install pinned Rust security auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependency security audit
        id: rust_dependency_audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Rust formatting
        id: rust_format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Structure check
        id: structure_check
        run: npm run check:tree

      - name: Frontend lint
        id: frontend_lint
        run: npm run lint

      - name: Rust clippy
        id: rust_clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # cargo test --lib isolado com --test-threads=1 para evitar conflitos de I/O
      # e lockfile em hosts Windows com AppLocker/antivirus ativo.
      # Para suites pesadas multithreaded, use o workflow desktop-e2e.yml num runner dedicado.
      - name: Rust tests
        id: rust_tests
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture --test-threads=1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

      # Alinhado com vite.config.ts (pool=forks, maxWorkers=1). Step timeout evita cancel silencioso do job inteiro.
      - name: Frontend tests
        id: frontend_tests
        timeout-minutes: 45
        run: npm test

      - name: TypeScript check
        id: tsc_check
        run: npx tsc --noEmit

      - name: Write CI summary
        if: always()
        run: |
          $lines = @(
            "# CI Summary",
            "",
            "- Ref: ${{ github.ref_name }}",
            "- Commit: ${{ github.sha }}",
            "- Structure check: ${{ steps.structure_check.outcome }}",
            "- Dependency audit: ${{ steps.dependency_audit.outcome }}",
            "- Rust dependency audit: ${{ steps.rust_dependency_audit.outcome }}",
            "- Rust formatting: ${{ steps.rust_format.outcome }}",
            "- Frontend lint: ${{ steps.frontend_lint.outcome }}",
            "- Rust clippy: ${{ steps.rust_clippy.outcome }}",
            "- Rust tests: ${{ steps.rust_tests.outcome }}",
            "- Frontend tests: ${{ steps.frontend_tests.outcome }}",
            "- TypeScript check: ${{ steps.tsc_check.outcome }}",
            "- Overall job: ${{ job.status }}",
            ""
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload CI validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-${{ github.run_id }}
          path: |
            src-tauri/target-test/validation/**
          if-no-files-found: ignore

  linux-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 16777216
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux build substrate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Immutable host contract tests
        run: npx vitest run scripts/host-manager.test.mjs scripts/linux-host-scripts.test.mjs scripts/security-contract.test.mjs

      - name: Dependency security audit
        run: npm run security:audit

      - name: Rust dependency security audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: License inventory
        run: npm run security:licenses

      - name: Structure, formatting, lint and types
        run: |
          npm run check:tree
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          npm run lint
          npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture --test-threads=1

      - name: Upload Linux validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-validation-${{ github.run_id }}
          path: src-tauri/target-test/validation/**
          if-no-files-found: ignore
